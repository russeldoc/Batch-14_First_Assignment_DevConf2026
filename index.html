<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devconf | 2026</title>
    <link rel="stylesheet" href="./style.css">
    <!-- font Arimo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

</head>

<body>
    <!-- Nav section start -->
    <header>
        <nav class="container">
            <div class="logo">
                <img src="assets/logo.png" alt="logo">
            </div>
            <div class="nav-text">
                <h3>Speaker</h3>
                <h3>Schedule</h3>
                <h3>Tracks</h3>
                <h3>Venue</h3>
                <h3>Blog</h3>
            </div>
            <button class="common-btn">Register Now</button>
        </nav>
    </header>
    <!-- Nav section end -->

    <!-- Hero section start -->

    <section class="hero-container container">
        <div class="hero-container-text">
            <h1>Code. Connect. Create</h1>
            <p>Join 4,000+ engineers, founders, and builders at the premier developer conference of 2026. Three days of
                cutting-edge talks, hands-on workshops, and meaningful connections.</p>
            <button class="common-btn">Register Now</button>
        </div>
    </section>

</body>

</html>
